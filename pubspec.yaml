name: form_field_adapter
description: "An interactive, focus-aware FormField wrapper that adds delightful state-based decorations, shake animations, and haptic feedback to any custom widget."
version: 1.1.0
homepage: https://github.com/hbsgujjar111/form_field_adapter
repository: https://github.com/hbsgujjar111/form_field_adapter
issue_tracker: https://github.com/hbsgujjar111/form_field_adapter/issues

topics:
  - form
  - validation
  - animation
  - widget
  - haptics

screenshots:
  - description: "Custom widgets (avatar picker, star rating, tag chips, switch card) as validated form fields with shake and error states."
    path: example/mobile-example.gif

environment:
  sdk: ^3.12.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

